name: simpleattendancechecker
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  mobile_scanner: ^7.4.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  intl: ^0.20.3
  permission_handler: ^12.0.3
  cloud_firestore: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
    - lib/assets/fonts/
    - lib/assets/fonts/Poppins/
    - lib/assets/fonts/K2D/

  fonts:
    - family: Poppins
      fonts:
        - asset: lib/assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
    - family: K2D
      fonts:
        - asset: lib/assets/fonts/K2D/K2D-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/K2D/K2D-Bold.ttf
          weight: 700
